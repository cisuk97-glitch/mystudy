<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A594F9"/>
      <stop offset="50%" stop-color="#8B78E6"/>
      <stop offset="100%" stop-color="#FF8EAA"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FDF7FF"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4B2C82" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- App Rounded Background -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>

  <!-- Inner Diary Card -->
  <rect x="76" y="86" width="360" height="340" rx="36" fill="url(#cardGrad)" filter="url(#softShadow)"/>

  <!-- Binder Rings on Left -->
  <circle cx="106" cy="140" r="10" fill="#D7CAFB"/>
  <circle cx="106" cy="210" r="10" fill="#D7CAFB"/>
  <circle cx="106" cy="280" r="10" fill="#D7CAFB"/>
  <circle cx="106" cy="350" r="10" fill="#D7CAFB"/>

  <!-- Notebook Lines -->
  <line x1="146" y1="160" x2="396" y2="160" stroke="#EFE9FF" stroke-width="4" stroke-linecap="round"/>
  <line x1="146" y1="220" x2="396" y2="220" stroke="#EFE9FF" stroke-width="4" stroke-linecap="round"/>
  <line x1="146" y1="280" x2="396" y2="280" stroke="#EFE9FF" stroke-width="4" stroke-linecap="round"/>
  <line x1="146" y1="340" x2="396" y2="340" stroke="#EFE9FF" stroke-width="4" stroke-linecap="round"/>

  <!-- English Ribbon/Crown -->
  <path d="M 180 180 C 210 130, 302 130, 332 180 C 310 230, 200 230, 180 180 Z" fill="#FFD3E2" opacity="0.6"/>

  <!-- Central Heart Icon -->
  <path d="M 256 220 C 256 200, 230 180, 206 180 C 180 180, 160 204, 160 232 C 160 270, 204 305, 256 345 C 308 305, 352 270, 352 232 C 352 204, 332 180, 306 180 C 282 180, 256 200, 256 220 Z" fill="#FF5376" filter="url(#softShadow)"/>

  <!-- Sparkle Stars -->
  <path d="M 360 120 L 366 136 L 382 142 L 366 148 L 360 164 L 354 148 L 338 142 L 354 136 Z" fill="#FFDF00"/>
  <path d="M 140 370 L 144 380 L 154 384 L 144 388 L 140 398 L 136 388 L 126 384 L 136 380 Z" fill="#FFDF00"/>

  <!-- Small English Badge "EN" -->
  <rect x="220" y="375" width="72" height="32" rx="16" fill="#8B78E6"/>
  <text x="256" y="397" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="18" font-weight="900" text-anchor="middle">EN 3</text>
</svg>
